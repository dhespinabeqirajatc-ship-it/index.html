<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Workiva Interactive Demo</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 30px;
}

.demo-container {
    position: relative;
    max-width: 1400px;
    margin: auto;
}

.demo-image {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.hotspot {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #0066ff;
    cursor: pointer;
    border: 3px solid white;
    box-shadow: 0 0 8px rgba(0,0,0,.3);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

.popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    width: 500px;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,.4);
    z-index: 1000;
}

.popup h2 {
    margin-top: 0;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
}

.close-btn {
    background: #0066ff;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    margin-top: 15px;
    border-radius: 4px;
}
</style>

</head>

<body>

<h1>Workiva Tax Solution Demo</h1>

<div class="demo-container">

    screenshot.png

    <!-- Hotspot 1 -->
    <div class="hotspot"
         style="top:15%; left:20%;"
         onclick="showPopup('tb')">
    </div>

    <!-- Hotspot 2 -->
    <div class="hotspot"
         style="top:45%; left:60%;"
         onclick="showPopup('mapping')">
    </div>

    <!-- Hotspot 3 -->
    <div class="hotspot"
         style="top:70%; left:35%;"
         onclick="showPopup('report')">
    </div>

</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">

    <h2 id="popup-title"></h2>

    <p id="popup-text"></p>

    <button class="close-btn"
            onclick="closePopup()">
        Close
    </button>

</div>

<script>

const content = {

    tb: {
        title: "Trial Balance Integration",
        text:
        "This area demonstrates how trial balances are automatically loaded into Workiva and mapped to statutory reporting structures."
    },

    mapping: {
        title: "Mapping Management",
        text:
        "Users can maintain mappings directly within Workiva. Changes flow automatically through calculations and reports."
    },

    report: {
        title: "Statutory Report",
        text:
        "This report is dynamically linked to source data and updates automatically when data changes."
    }
};

function showPopup(id){

    document.getElementById("popup-title").innerText =
        content[id].title;

    document.getElementById("popup-text").innerText =
        content[id].text;

    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function closePopup(){

    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}

</script>

</body>
</html>
